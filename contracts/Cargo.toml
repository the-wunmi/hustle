[workspace]
resolver = "2"
members = ["common", "credits", "registry", "agent-wallet", "job-board", "reputation", "badges", "market", "fixtures/nft-receiver", "tests"]

[workspace.package]
edition = "2021"
rust-version = "1.86"
publish = false

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
hustle-common = { path = "common" }

# cargo-near builds with --release; these settings keep the wasm small (every agent wallet pays
# storage for its own copy of the code) and keep overflow checks on in contract code.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
