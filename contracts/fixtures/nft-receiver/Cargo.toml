[package]
name = "hustle-fixture-nft-receiver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test-only contract: an NFT receiver that tries to drain an agent wallet during
# `nft_on_transfer` and then hands the token back. Never deployed outside the sandbox tests.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
